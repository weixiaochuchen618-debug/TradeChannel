<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TradeChannel</title>
  <!-- 令牌层必须最先加载：app.css / forms.css 不再声明 :root 颜色变量。 -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="forms.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="主导航">
        <button data-page="home" class="nav active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3zM9 21v-8h6v8"/></svg>首页</button>
        <button data-page="lines" class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h12m-3-3 3 3-3 3M21 17H9m3-3-3 3 3 3"/><circle cx="4" cy="17" r="2"/><circle cx="20" cy="7" r="2"/></svg>线路</button>
        <button data-page="apps" class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>应用</button>
        <button data-page="settings" class="nav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7m4 0h7M3 17h11m4 0h3"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg>设置</button>
      </nav>
      <div class="sidebar-bottom"><div id="mini-status" class="mini-status">正在读取连接状态</div><div class="version" id="version">TradeChannel</div></div>
    </aside>
    <main id="main" tabindex="-1" aria-label="页面内容"><div class="empty"><div class="loader"></div><h1>正在读取连接状态</h1></div></main>
  </div>
  <div id="drawer" class="drawer-backdrop" hidden></div>
  <div id="dialog-root" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <!-- 0.22.1 B1 悬浮说明：必须放在 #main 外面，否则 reconcile 每 250ms 重画会把它冲掉。
       WebView2 版本闸门在宿主，popover API 闸门在 app.js；任一不满足都退回普通定位 div。 -->
  <div id="hint-layer" role="tooltip" popover="manual" hidden></div>
  <script src="app.js"></script>
</body>
</html>
